    <style>
        /* ── Layout ── */
        #tools-page {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }
        #tools-page h1 {
            font-size: 2rem;
            margin-bottom: 6px;
        }
        #tools-page .subtitle {
            font-weight: normal;
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        /* ── Shared tool card chrome ── */
        .tool-card {
            border: 2px solid rgba(255,44,90,0.3);
            border-radius: 12px;
            padding: 36px 32px;
            margin-bottom: 36px;
        }
        .tool-card:last-child { margin-bottom: 0; }
        .tool-card h2 {
            font-size: 1.4rem;
            border-bottom: 3px solid rgb(255,44,90);
            padding-bottom: 8px;
            margin: 0 0 28px;
            display: inline-block;
        }
        .tool-card .tool-desc {
            font-weight: normal;
            font-size: 0.85rem;
            opacity: 0.65;
            margin: -20px 0 28px;
        }

        .field-label {
            display: block;
            font-size: 0.78rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .tool-card input[type="text"],
        .tool-card input[type="number"],
        .tool-card select {
            padding: 9px 12px;
            border: 1.5px solid rgba(255,44,90,0.35);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            background: transparent;
            color: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .tool-card input[type="text"]:focus,
        .tool-card input[type="number"]:focus,
        .tool-card select:focus {
            outline: none;
            border-color: rgb(255,44,90);
        }

        /* ── Buttons ── */
        .btn {
            padding: 10px 28px;
            border: 2px solid rgb(255,44,90);
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s ease;
            letter-spacing: 0.03em;
        }
        .btn-primary {
            background: rgb(255,44,90);
            color: #fff;
        }
        .btn-primary:hover {
            background: rgb(220,20,70);
            border-color: rgb(220,20,70);
        }
        .btn-secondary {
            background: transparent;
            color: rgb(255,44,90);
        }
        .btn-secondary:hover {
            background: rgba(255,44,90,0.1);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ── Status / error messaging ── */
        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: rgb(255,44,90);
            min-height: 22px;
            margin-top: 14px;
            letter-spacing: 0.04em;
        }
        .error-msg {
            font-size: 0.8rem;
            font-weight: bold;
            color: rgb(255,44,90);
            min-height: 18px;
            margin: 6px 0 4px;
        }

        body.dark-mode .tool-card input[type="number"],
        body.dark-mode .tool-card input[type="text"],
        body.dark-mode .tool-card select {
            background: rgba(255,255,255,0.04);
        }

        @media screen and (max-width: 420px) {
            .tool-card { padding: 24px 16px; }
        }
    </style>
</head>
